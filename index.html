const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const declared=params.get('lang');let saved;try{saved=localStorage.getItem('ideal-support-lang')}catch(e){}const browser=(navigator.languages?.[0]||navigator.language||'en').slice(0,2).toLowerCase();const lang=I18N[declared]?declared:I18N[saved]?saved:I18N[browser]?browser:'en';const state={lang,cycle:'once',amount:'10',other:false};let hasBackend=false;const ref=params.get('ref');const safeRef=ref&&/^[a-zA-Z0-9_-]{1,80}$/.test(ref)?ref:null;function refUrl(s){if(!safeRef)return s;const url=new URL(s);url.searchParams.set('client_reference_id','ref_'+safeRef);return url.href}

function draw(){const t=I18N[state.lang];document.getElementById("preview-label").textContent=({ru:"ТЕСТОВАЯ ВЕРСИЯ — БЕЗ ОПЛАТЫ",de:"TESTVERSION — KEINE ZAHLUNGEN",en:"PREVIEW — PAYMENTS DISABLED",uk:"ТЕСТОВА ВЕРСІЯ — БЕЗ ОПЛАТИ"})[state.lang];document.documentElement.lang=state.lang;document.title=t.title+' | Ideal Systems';document.querySelector('meta[name="description"]').content=t.intro;for(let [id,val] of Object.entries({'eyebrow':t.eyebrow,'title':t.title,'intro':t.intro,'frequency-label':t.frequency,'once':t.once,'monthly':t.monthly,'amount-label':t.amount,'custom-button':t.custom,'custom-label':t.customLabel,'amount-caption':state.cycle==='once'?t.oneNote:t.monthNote,'pay-label':t.pay,'pay-explain':t.payExplain,'about-title':t.aboutTitle,'about-body':t.aboutBody,'message-title':t.messageTitle,'message-body':t.messageBody,'share-title':t.shareTitle,'share-body':t.shareBody,'copy':t.copy,'footer':t.footer}))v(id,val);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===state.lang)));$('once').setAttribute('aria-pressed',String(state.cycle==='once'));$('monthly').setAttribute('aria-pressed',String(state.cycle==='monthly'));document.querySelectorAll('[data-amount]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.amount===(state.other?'custom':state.amount))));$('amount').value=state.amount;const customMonthly=state.cycle==='monthly'&&!STRIPE.monthly[(euros(state.amount)/100)?.toString()];v('checkout-status',customMonthly&&!hasBackend?t.notReady:hasBackend?t.ready:'');$('error').textContent=''}
function euros(s){let v=s.trim().replace(',','.');if(!/^(?:\d{1,5})(?:\.\d{1,2})?$/.test(v))return null;let n=Math.round(Number(v)*100);return n>=100&&n<=1000000?n:null}

async function checkout(){msgError(({ru:"Тестовая версия. Оплата отключена.",de:"Testversion. Zahlungen sind deaktiviert.",en:"Preview version. Payments are disabled.",uk:"Тестова версія. Оплату вимкнено."})[state.lang]);return;const cents=euros($('amount').value);const t=I18N[state.lang];if(cents===null){msgError(t.invalid);$('amount').focus();return;}const exact=(cents/100).toString();if(!hasBackend && state.cycle==='once'){if(cents!==1000){msgError(t.oneFallback);if(!confirm(t.oneConfirm))return;}location.href=refUrl(STRIPE.once);return;}if(!hasBackend && state.cycle==='monthly'){if(STRIPE.monthly[exact]){location.href=refUrl(STRIPE.monthly[exact]);return;}msgError(t.backend);return;}
$('pay').disabled=true;try{const r=await fetch('/api/create-checkout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({amount_cents:cents,cycle:state.cycle,lang:state.lang,ref:safeRef})});const data=await r.json().catch(()=>({}));if(!r.ok||!/^https:\/\/(?:checkout|billing)\.stripe\.com\//.test(data.url||''))throw Error('no checkout');location.href=data.url}catch(e){if(state.cycle==='once'){msgError(t.oneFallback);setTimeout(()=>{if(confirm(t.oneConfirm))location.href=refUrl(STRIPE.once)},0)}else msgError(t.backend)}finally{$('pay').disabled=false}}
const click=(id,fn)=>$(id).addEventListener('click',fn);
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{state.lang=b.dataset.lang;try{localStorage.setItem('ideal-support-lang',state.lang)}catch(e){}draw()}));click('once',()=>{state.cycle='once';draw()});click('monthly',()=>{state.cycle='monthly';draw()});document.querySelectorAll('[data-amount]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.amount==='custom'){state.other=true;state.amount=$('amount').value;draw();$('amount').focus();$('amount').select()}else{state.other=false;state.amount=b.dataset.amount;draw()}}));$('amount').addEventListener('input',()=>{state.amount=$('amount').value;state.other=!['3','10','25'].includes(state.amount);document.querySelectorAll('[data-amount]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.amount===(state.other?'custom':state.amount))));$('error').textContent=''});click('pay',checkout);click('copy',async()=>{const t=I18N[state.lang];if(location.protocol==='file:'){v('copy-status',t.notPublished);return;}try{await navigator.clipboard.writeText(location.origin+location.pathname);v('copy-status',t.copied)}catch(e){v('copy-status',t.copyError)}});draw();if(location.protocol==='http:'||location.protocol==='https:'){fetch('/api/status').then(r=>r.ok?r.json():null).then(d=>{hasBackend=Boolean(d?.dynamicMonthlyEnabled);draw()}).catch(()=>{})}window.__testIdeal={euros,I18N,STRIPE,state,checkout};})();
